[workspace]
resolver = "2"
members = [
    "crates/bootlegger-core",
    "crates/bootlegger-format",
    "crates/bootlegger-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ecch1ch1 <bootlegger.omnivore184@passfwd.com>"]
license = "MPL-2.0"
repository = "https://github.com/ecch1ch1/Bootlegger"

[workspace.dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
colored = "3.0"
tar = "0.4"
